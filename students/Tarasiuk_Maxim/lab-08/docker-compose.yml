version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - portfolio_service
      - trading_service

  portfolio_service:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.portfolio_service.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - rabbitmq
      - portfolio_db

  trading_service:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.trading_service.main:app --host 0.0.0.0 --port 8001
    depends_on:
      - rabbitmq
      - trading_db

  notification_service:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python -m services.notification_service.main
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  portfolio_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=portfolio_db
  
  trading_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=trading_db
