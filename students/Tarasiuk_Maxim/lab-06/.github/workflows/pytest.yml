name: Python application tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov fastapi uvicorn sqlalchemy pydantic httpx
        
    - name: Test with pytest
      run: |
        # Run tests spanning unit, integration and E2E 
        pytest src/students/Tarasiuk_Maxim/lab-06/tests/ -v --cov=src.students.Tarasiuk_Maxim.lab_03 --cov=src.students.Tarasiuk_Maxim.lab_04 --cov=src.students.Tarasiuk_Maxim.lab_05
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
